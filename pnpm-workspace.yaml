# Hoisted (flat) node_modules: React Native / Expo must resolve to exactly ONE copy of react, react-native
# and every expo-* module across the apps and the shared mobile packages. pnpm's isolated layout created
# duplicate copies per peer context (DECISIONS D-2).
nodeLinker: hoisted

packages:
  - apps/*
  - services/*
  - packages/*

# Install scripts are denied by default (supply-chain safety). Each allowed/denied package was reviewed.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # embedded-postgres: only re-creates symlinks inside its bundled PostgreSQL binaries (tests/dev DB).
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  # Denied: these only compile native code when a prebuilt binary is missing.
  '@parcel/watcher': false
  unrs-resolver: false

# pnpm 11 refuses very recently published versions by default. These Expo SDK 57 patch releases were
# pinned by `expo install` as the SDK-compatible versions, so they are exempted explicitly.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-notifications@57.0.21
  - expo-router@57.0.23
  - expo-location@57.0.20

# Single versions of the Expo / React Native stack for all three apps and the shared mobile packages.
# Sharing foundations means the apps move to a new Expo SDK together (DECISIONS D-30); releases stay independent.
catalog:
  expo: '~57.0.25'
  expo-audio: '~57.0.5'
  expo-constants: '~57.0.19'
  expo-image-picker: '~57.0.20'
  expo-device: '~57.0.2'
  expo-linking: '~57.0.11'
  expo-location: '~57.0.20'
  expo-notifications: '~57.0.21'
  expo-router: '~57.0.23'
  expo-secure-store: '~57.0.4'
  expo-splash-screen: '~57.0.9'
  expo-status-bar: '~57.0.1'
  expo-system-ui: '~57.0.4'
  expo-task-manager: '~57.0.20'
  react: '19.2.3'
  react-dom: '19.2.3'
  react-native: '0.86.3'
  react-native-safe-area-context: '~5.7.0'
  react-native-screens: '~4.26.2'
  '@react-native-community/netinfo': '12.0.1'
  '@react-native-async-storage/async-storage': '2.2.0'
  '@tanstack/react-query': '^5.103.2'
  jest: '~29.7.0'
  jest-expo: '^57.0.5'
  '@testing-library/react-native': '^14.0.1'

# One react / react-dom across the workspace (admin's UI libraries otherwise pull a second react-dom).
overrides:
  react: 19.2.3
  react-dom: 19.2.3
